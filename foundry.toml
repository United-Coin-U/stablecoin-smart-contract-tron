# Foundry is used ONLY as a local test harness for the Solidity sources in
# contracts/. Deployment to TRON still goes through tronbox (see tronbox.js);
# solc_version here is pinned to the exact version tronbox compiles with so the
# bytecode under test matches what is shipped.
[profile.default]
src = "contracts"
out = "out"
test = "test"
libs = ["lib", "node_modules"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 200
extra_output = ["storageLayout"]
